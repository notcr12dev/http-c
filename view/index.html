<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP C server</title>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
    <h1>Hello World in HTTP C server</h1>
    <p>A simple HTTP server in C</p>

    <div>
        <form id="cacheForm">
            <div>
                <label for="inputKey">Key:</label>
                <input type="text" id="inputKey" required>
            </div>
            <div>
                <label for="inputValue">Value:</label>
                <input type="text" id="inputValue" required>
            </div>
            <div>
                <label for="inputTTL">TTL:</label>
                <input type="number" id="inputTTL" min="0">
            </div>
            <button type="submit">Save</button>
        </form>
    </div>

    <span id="api">Loading . . .</span>
    <script src="./view/main.js"></script>
</body>
</html>
